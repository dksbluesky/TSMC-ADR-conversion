<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#2563eb">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <title>台股開盤預估</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="./market-data.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #f5f7fa; color: #1e293b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .glass-panel { background: #fff; border: 1px solid #e2e8f0; box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04); }
        .input-field { background: #fff; border: 1px solid #cbd5e1; color: #1e293b; width: 100%; min-width: 0; min-height: 44px; transition: border-color 0.2s, box-shadow 0.2s; }
        .input-field:focus { border-color: #2563eb; outline: none; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.16); }
        .input-field.empty { color: #94a3b8; }
        .btn-live { background: #1d4ed8; transition: background-color 0.2s; min-height: 44px; }
        .btn-live:hover { background: #1e40af; }
        :focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
        .forecast-card { min-width: 0; overflow-wrap: anywhere; }
        .forecast-card { min-height: 160px; }
        .forecast-price, .summary-value, .forecast-baseline > div:last-child { font-variant-numeric: tabular-nums; }
        .forecast-price { letter-spacing: -0.04em; }
        .forecast-main { min-height: 36px; }
        .forecast-state { min-height: 24px; }
        .app-header { margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 1px solid #e2e8f0; }
        .header-controls { flex-wrap: wrap; justify-content: flex-end; }
        .compact-status { color: #64748b; font-size: 0.75rem; white-space: nowrap; }
        .provisional-label { color: #64748b; background: #f1f5f9; border-radius: 9999px; padding: 0.25rem 0.5rem; font-size: 0.6875rem; white-space: nowrap; }
        .summary-label { color: #64748b; font-size: 0.6875rem; }
        .summary-value { color: #334155; font-size: 1.125rem; font-weight: 600; margin-top: 0.125rem; }
        .data-summary-row { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; font-size: 0.75rem; line-height: 1.5; color: #64748b; }
        .data-summary-row strong { color: #475569; font-weight: 600; text-align: right; }
        .disclosure-summary { min-height: 44px; cursor: pointer; display: flex; align-items: center; }
        .disclosure-summary::marker { color: #64748b; }
        .source-link { color: #1d4ed8; text-decoration: underline; text-underline-offset: 2px; overflow-wrap: anywhere; }
        @media (max-width: 360px) {
          .page-shell { padding-left: 12px !important; padding-right: 12px !important; }
          .forecast-price { font-size: 2rem; }
          .manual-ticker-row { flex-wrap: wrap; }
          .manual-ticker-row input[aria-label$="ticker"] { flex: 1 1 6rem; }
          .manual-ticker-row input[type="number"] { flex: 1 1 8rem; }
        }
        .spinner { display: inline-block; width: 0.8rem; height: 0.8rem; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s infinite; margin-right: 0.4rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .text-up { color: #dc2626; } .text-down { color: #059669; }

        /* 狀態燈號 */
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
        .status-green { background-color: #6b9b7b; }
        .status-yellow { background-color: #c6a95c; }
        .status-red { background-color: #be7777; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" src="./app.jsx?v=8"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js', { scope: './' })
                    .catch(error => console.warn('Service worker registration failed:', error));
            });
        }
    </script>
</body>
</html>
