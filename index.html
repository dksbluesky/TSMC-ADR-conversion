<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 台積電 ADR 行情推算機 (V26 終極校正版)</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f1f5f9; color: #1e293b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .glass-panel { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(0, 0, 0, 0.08); }
        .input-field { background: rgba(255, 255, 255, 0.9); border: 1px solid #cbd5e1; color: #1e293b; width: 100%; transition: all 0.2s; }
        .input-field:focus { border-color: #3b82f6; outline: none; background: rgba(255, 255, 255, 1); }
        .input-field.empty { color: #94a3b8; }
        .btn-live { background: linear-gradient(to right, #2563eb, #3b82f6); transition: all 0.2s; }
        .btn-live:hover { background: linear-gradient(to right, #1d4ed8, #2563eb); transform: translateY(-1px); }
        .spinner { display: inline-block; width: 0.8rem; height: 0.8rem; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s infinite; margin-right: 0.4rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .text-up { color: #f87171; } .text-down { color: #4ade80; }
        
        /* 狀態燈號 */
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
        .status-green { background-color: #4ade80; box-shadow: 0 0 5px #4ade80; }
        .status-yellow { background-color: #facc15; animation: pulse 1s infinite; }
        .status-red { background-color: #f87171; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const App = () => {
            const [baseData, setBaseData] = useState({ adr: 0, tw2330: 0, twB: 0, twC: 0 });
            const [liveData, setLiveData] = useState({ adr: 0, fx: 0 });
            const [tsmWeight, setTsmWeight] = useState(60);
            const [tickers, setTickers] = useState({ b: "006208", c: "00878" });
            const [leverageC, setLeverageC] = useState(1);
            
            const [loading, setLoading] = useState(true);
            const [statusMsg, setStatusMsg] = useState("系統啟動...");
            const [lastUpdated, setLastUpdated] = useState(null);
            const [statusColor, setStatusColor] = useState("status-yellow");

            // --- 核心修正：無視 Yahoo 錯誤 Meta，用歷史 K 棒嚴格倒推時間軸 ---
            const extractPrices = (json) => {
                try {
                    const result = json?.chart?.result?.[0];
                    if (!result || !result.indicators || !result.indicators.quote) return null;

                    const meta = result.meta;
                    const quotes = result.indicators.quote[0].close;
                    const timestamps = result.timestamp;
                    
                    // 建立結構化歷史數據陣列
                    const validData = [];
                    if (quotes && timestamps) {
                        for (let i = 0; i < quotes.length; i++) {
                            if (quotes[i] !== null && quotes[i] !== undefined) {
                                validData.push({
                                    timestamp: timestamps[i],
                                    dateStr: new Date(timestamps[i] * 1000).toLocaleDateString('zh-TW'),
                                    price: quotes[i]
                                });
                            }
                        }
                    }

                    if (validData.length === 0) return null;

                    // 1. 【分子：最新交易日現價/收盤】永遠拿最後一根 K 棒
                    const livePrice = validData[validData.length - 1].price;

                    // 2. 【分母：昨收基準】永遠拿倒數第二根 K 棒 (完美避開 Yahoo 週末 Meta 飄移錯誤)
                    let prevPrice = null;
                    if (validData.length > 1) {
                        prevPrice = validData[validData.length - 2].price;
                    } else {
                        prevPrice = meta.chartPreviousClose || livePrice;
                    }
                    
                    console.log(`🎯 [${meta.symbol}] 精準校正判定 -> 分子(6/13最新): ${livePrice}, 分母(6/12昨收): ${prevPrice}`);
                    
                    return {
                        live: parseFloat(livePrice.toFixed(2)),
                        prev: parseFloat(prevPrice.toFixed(2))
                    };
                } catch (e) { 
                    console.error("數據解析錯誤:", e);
                    return null; 
                }
            };

            // --- 核心：多重路徑代理解析 (優化線路切換，防止 CORS 阻擋) ---
            const fetchWithFailover = async (symbol) => {
                const timestamp = Date.now();
                const rawUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1d&range=5d&_t=${timestamp}`;
                const targetUrl = encodeURIComponent(rawUrl);
                
                const proxies = [
                    { name: "線路 A (allorigins)", url: `https://api.allorigins.win/get?url=${targetUrl}` },
                    { name: "線路 B (corsproxy)", url: `https://corsproxy.io/?${encodeURIComponent(rawUrl)}` },
                    { name: "線路 C (thingproxy)", url: `https://thingproxy.freeboard.io/fetch/${rawUrl}` }
                ];

                for (let proxy of proxies) {
                    try {
                        console.log(`正在透過 [${proxy.name}] 請求標的: ${symbol}`);
                        const res = await fetch(proxy.url);
                        if (!res.ok) throw new Error(`HTTP 錯誤狀態碼: ${res.status}`);
                        
                        let json;
                        if (proxy.url.includes("allorigins")) {
                            const data = await res.json();
                            json = JSON.parse(data.contents);
                        } else {
                            json = await res.json();
                        }

                        const prices = extractPrices(json);
                        if (prices) {
                            console.log(`✅ [${proxy.name}] 成功獲取並解析標的: ${symbol}`);
                            return prices; // 成功拿到就立刻回傳
                        }
                    } catch (err) {
                        console.warn(`❌ [${proxy.name}] 請求失敗或遭遇阻擋，自動切換下一條線路。錯誤:`, err.message);
                        continue; // 失敗則自動進入下一條代理線路
                    }
                }
                return null; // 三條線路皆宣告失敗
            };

            const runAutoSync = async () => {
                setLoading(true);
                setStatusMsg("正在同步國際金融行情與跨域校正...");
                setStatusColor("status-yellow");
                
                try {
                    const [dAdr, d2330, dB, dC] = await Promise.all([
                        fetchWithFailover("TSM"),
                        fetchWithFailover("2330.TW"),
                        fetchWithFailover(`${tickers.b}.TW`),
                        fetchWithFailover(`${tickers.c}.TW`)
                    ]);

                    let fxVal = liveData.fx;
                    try {
                        const res = await fetch("https://api.exchangerate-api.com/v4/latest/USD");
                        const j = await res.json();
                        if(j.rates.TWD) fxVal = j.rates.TWD;
                    } catch(e) { if(fxVal===0) fxVal = 32.5; }

                    let successCount = 0;
                    const updates = {};
                    
                    if (dAdr) { updates.adr = dAdr; successCount++; }
                    if (d2330) { updates.tw2330 = d2330; successCount++; }
                    if (dB) { updates.twB = dB; successCount++; }
                    if (dC) { updates.twC = dC; successCount++; }

                    setBaseData(prev => ({
                        adr: updates.adr ? updates.adr.prev : prev.adr,
                        tw2330: updates.tw2330 ? updates.tw2330.live : prev.tw2330,
                        twB: updates.twB ? updates.twB.live : prev.twB,
                        twC: updates.twC ? updates.twC.live : prev.twC
                    }));

                    setLiveData(prev => ({
                        adr: updates.adr ? updates.adr.live : prev.adr,
                        fx: fxVal
                    }));

                    setLastUpdated(new Date());

                    if (successCount === 4) {
                        setStatusMsg("所有數據同步且校正回歸成功");
                        setStatusColor("status-green");
                    } else if (successCount > 0) {
                        setStatusMsg(`部分數據同步成功 (${successCount}/4)，請注意缺漏項`);
                        setStatusColor("status-yellow");
                    } else {
                        setStatusMsg("跨域連線受阻，請手動輸入數值");
                        setStatusColor("status-red");
                    }

                } catch (err) {
                    setStatusMsg("系統執行階段錯誤");
                    setStatusColor("status-red");
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => { runAutoSync(); }, [tickers]);

            // --- 計算邏輯 ---
            const adrChangePct = useMemo(() => {
                if (!baseData.adr || !liveData.adr) return 0;
                return ((liveData.adr - baseData.adr) / baseData.adr) * 100;
            }, [liveData.adr, baseData.adr]);

            const parity = useMemo(() => (liveData.adr / 5) * liveData.fx, [liveData.adr, liveData.fx]);
            const premium = useMemo(() => baseData.tw2330 ? ((parity - baseData.tw2330) / baseData.tw2330) * 100 : 0, [parity, baseData.tw2330]);

            const predictions = useMemo(() => {
                if (!baseData.tw2330) return null;
                const getPrice = (base, pct) => Math.round(base * (1 + pct/100));
                
                const p2330 = {
                    con: getPrice(baseData.tw2330, adrChangePct * 0.6),
                    neu: getPrice(baseData.tw2330, adrChangePct * 0.8),
                    agg: getPrice(baseData.tw2330, adrChangePct * 0.95)
                };
                const getB = (t2330) => {
                    if (!baseData.tw2330) return 0;
                    const impact = ((t2330 - baseData.tw2330)/baseData.tw2330) * 100 * (tsmWeight/100);
                    return parseFloat((baseData.twB * (1 + impact/100)).toFixed(2));
                };
                const pB = { con: getB(p2330.con), neu: getB(p2330.neu), agg: getB(p2330.agg) };
                const getC = (tB) => {
                    if (!baseData.twB) return 0;
                    const impact = ((tB - baseData.twB)/baseData.twB) * leverageC;
                    return parseFloat((baseData.twC * (1 + impact)).toFixed(2));
                };
                const pC = { con: getC(pB.con), neu: getC(pB.neu), agg: getC(pB.agg) };
                return { p2330, pB, pC };
            }, [baseData, adrChangePct, tsmWeight, leverageC]);

            const fmt = (n) => n ? new Intl.NumberFormat('zh-TW', { maximumFractionDigits: 2, minimumFractionDigits: 2 }).format(n) : "---";
            const color = (v, base) => v > base ? 'text-up' : v < base ? 'text-down' : 'text-slate-500';

            return (
                <div className="min-h-screen p-4 md:p-8 max-w-5xl mx-auto">
                    
                    <div className="flex flex-col md:flex-row justify-between items-center mb-6 pb-4 border-b border-slate-300 gap-4">
                        <div>
                            <h1 className="text-xl font-bold text-slate-900 flex gap-2 items-center">
                                <i className="fa-solid fa-network-wired text-emerald-400"></i> 台積電 ADR 行情推算機
                            </h1>
                            <p className="text-xs text-slate-500 mt-1">V26 終極校正版</p>
                        </div>
                        <button onClick={runAutoSync} disabled={loading} className="btn-live text-white px-8 py-2 rounded-lg font-bold shadow-lg flex items-center justify-center min-w-[160px]">
                            {loading ? <><span className="spinner"></span> 搜尋中...</> : <><i className="fa-solid fa-rotate mr-2"></i> 強制重抓</>}
                        </button>
                    </div>

                    <div className={`bg-slate-100 text-sm px-4 py-2 rounded mb-6 flex items-center border border-slate-300`}>
                        <span className={`status-dot ${statusColor}`}></span>
                        <span className="text-slate-700">{statusMsg}</span>
                        {lastUpdated && <span className="text-slate-400 text-xs ml-2">(更新於 {lastUpdated.toLocaleTimeString('zh-TW')})</span>}
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                        
                        <div className="lg:col-span-5 space-y-5">
                            <div className="glass-panel p-5 rounded-xl border-l-4 border-blue-500 relative">
                                <h3 className="text-slate-900 font-bold mb-4">美股 ADR (TSM)</h3>
                                <div className="grid grid-cols-2 gap-4 mb-4">
                                    <div>
                                        <label className="input-label">昨收基準 (分母)</label>
                                        <input type="number" step="0.01" className={`input-field px-3 py-2 rounded text-right border-yellow-500 ${!baseData.adr && 'empty'}`} placeholder="等待..." value={baseData.adr || ''} onChange={e => setBaseData({...baseData, adr: parseFloat(e.target.value) || 0})}/>
                                    </div>
                                    <div>
                                        <label className="input-label">最新現價 (分子)</label>
                                        <input type="number" step="0.01" className={`input-field px-3 py-2 rounded text-right font-bold text-lg border-blue-500 ${!liveData.adr && 'empty'}`} placeholder="等待..." value={liveData.adr || ''} onChange={e => setLiveData({...liveData, adr: parseFloat(e.target.value) || 0})}/>
                                    </div>
                                </div>
                                <div className="flex justify-between items-center bg-slate-100 p-3 rounded-lg border border-slate-300">
                                    <div className="text-xs text-slate-500">即時漲跌幅</div>
                                    <div className={`text-2xl font-bold ${adrChangePct >= 0 ? 'text-up' : 'text-down'}`}>{adrChangePct > 0 ? '+' : ''}{fmt(adrChangePct)}%</div>
                                </div>
                                <div className="mt-4"><label className="input-label">匯率 (USD/TWD)</label><input type="number" step="0.01" className="input-field px-3 py-2 rounded text-yellow-400" value={liveData.fx || ''} onChange={e => setLiveData({...liveData, fx: parseFloat(e.target.value) || 0})}/></div>
                            </div>

                            <div className="glass-panel p-5 rounded-xl border-l-4 border-green-500">
                                <h3 className="text-slate-900 font-bold mb-4">台股最新收盤 (預測基準)</h3>
                                <div className="space-y-3">
                                    <div className="flex justify-between items-center">
                                        <label className="text-slate-600 text-sm">2330 台積電</label>
                                        <input type="number" step="0.1" className={`input-field w-28 px-2 py-1 rounded text-right text-slate-600 ${!baseData.tw2330 && 'empty'}`} placeholder="等待..." value={baseData.tw2330 || ''} onChange={e => setBaseData({...baseData, tw2330: parseFloat(e.target.value) || 0})}/>
                                    </div>
                                    <div className="flex justify-between items-center">
                                        <input type="text" className="input-field w-20 px-2 py-1 rounded text-xs text-slate-600" value={tickers.b} onChange={e => setTickers({...tickers, b: e.target.value.trim()})}/>
                                        <input type="number" step="0.01" className={`input-field w-28 px-2 py-1 rounded text-right text-slate-600 ${!baseData.twB && 'empty'}`} placeholder="等待..." value={baseData.twB || ''} onChange={e => setBaseData({...baseData, twB: parseFloat(e.target.value) || 0})}/>
                                    </div>
                                    <div className="flex justify-between items-center">
                                        <input type="text" className="input-field w-20 px-2 py-1 rounded text-xs text-slate-600" value={tickers.c} onChange={e => setTickers({...tickers, c: e.target.value.trim()})}/>
                                        <input type="number" step="0.01" className={`input-field w-28 px-2 py-1 rounded text-right text-slate-600 ${!baseData.twC && 'empty'}`} placeholder="等待..." value={baseData.twC || ''} onChange={e => setBaseData({...baseData, twC: parseFloat(e.target.value) || 0})}/>
                                    </div>
                                </div>
                                <div className="mt-4 pt-4 border-t border-slate-300 flex items-center justify-between"><span className="text-xs text-slate-400">權重參數 {tsmWeight}%</span><input type="range" min="40" max="80" className="w-24 h-1 bg-slate-300 rounded-lg cursor-pointer" value={tsmWeight} onChange={e => setTsmWeight(parseInt(e.target.value))}/></div>
                                <div className="mt-3 flex items-center justify-between"><span className="text-xs text-slate-400">{tickers.c} 槓桿倍數 (1=現股, 2=正2)</span><input type="number" step="0.5" className="input-field w-16 px-2 py-1 rounded text-right text-slate-600" value={leverageC} onChange={e => setLeverageC(parseFloat(e.target.value) || 0)}/></div>
                            </div>
                        </div>

                        <div className="lg:col-span-7 space-y-5">
                            <div className="grid grid-cols-2 gap-4">
                                <div className="glass-panel p-4 rounded-xl text-center"><div className="text-xs text-slate-500 uppercase tracking-wider">理論折算價</div><div className="text-3xl font-mono font-bold text-slate-900 mt-1">{loading ? "..." : `$${fmt(parity)}`}</div></div>
                                <div className="glass-panel p-4 rounded-xl text-center border border-slate-300"><div className="text-xs text-slate-500 uppercase tracking-wider">溢價率</div><div className={`text-3xl font-mono font-bold mt-1 ${premium > 0 ? 'text-yellow-400' : 'text-blue-400'}`}>{loading ? "..." : `${premium > 0 ? '+' : ''}${fmt(premium)}%`}</div></div>
                            </div>

                            <div className="glass-panel rounded-xl overflow-hidden border border-slate-300">
                                <div className="bg-slate-100 px-6 py-3 border-b border-slate-300"><h3 className="font-bold text-slate-900 text-sm uppercase tracking-wide">今日開盤預估</h3></div>
                                {predictions && baseData.tw2330 > 0 ? (
                                    <table className="w-full text-left text-sm">
                                        <thead><tr className="border-b border-slate-300 bg-slate-100 text-slate-500"><th className="p-4 font-medium">情境</th><th className="p-4 font-medium">2330</th><th className="p-4 font-medium">{tickers.b}</th><th className="p-4 font-medium">{tickers.c}</th></tr></thead>
                                        <tbody className="divide-y divide-gray-700/50">
                                            <tr className="hover:bg-slate-100 transition"><td className="p-4 text-slate-500 font-bold">保守 (60%)</td><td className={`p-4 font-mono font-bold text-lg ${color(predictions.p2330.con, baseData.tw2330)}`}>{fmt(predictions.p2330.con)}</td><td className={`p-4 font-mono ${color(predictions.pB.con, baseData.twB)}`}>{fmt(predictions.pB.con)}</td><td className={`p-4 font-mono ${color(predictions.pC.con, baseData.twC)}`}>{fmt(predictions.pC.con)}</td></tr>
                                            <tr className="hover:bg-slate-100 transition bg-slate-50 border-l-4 border-l-blue-500"><td className="p-4 text-blue-400 font-bold">中性 (80%)</td><td className={`p-4 font-mono font-bold text-lg ${color(predictions.p2330.neu, baseData.tw2330)}`}>{fmt(predictions.p2330.neu)}</td><td className={`p-4 font-mono ${color(predictions.pB.neu, baseData.twB)}`}>{fmt(predictions.pB.neu)}</td><td className={`p-4 font-mono ${color(predictions.pC.neu, baseData.twC)}`}>{fmt(predictions.pC.neu)}</td></tr>
                                            <tr className="hover:bg-slate-100 transition"><td className="p-4 text-red-400 font-bold">樂觀 (95%)</td><td className={`p-4 font-mono font-bold text-lg ${color(predictions.p2330.agg, baseData.tw2330)}`}>{fmt(predictions.p2330.agg)}</td><td className={`p-4 font-mono ${color(predictions.pB.agg, baseData.twB)}`}>{fmt(predictions.pB.agg)}</td><td className={`p-4 font-mono ${color(predictions.pC.agg, baseData.twC)}`}>{fmt(predictions.pC.agg)}</td></tr>
                                        </tbody>
                                    </table>
                                ) : (
                                    <div className="p-10 text-center text-slate-400">{loading ? "數據搜尋中，請稍候..." : "等待數據 (請確認網路或手動輸入)"}</div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
